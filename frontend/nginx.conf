server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The REST API (report-service behind api-gateway, Person A) is not part of this repository.
  # To add it back, replace this block with:
  #   location /api/ {
  #     proxy_pass http://api-gateway:8080;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header Connection "";
  #     proxy_buffering off;          # lets SSE events through immediately
  #     proxy_read_timeout 1h;
  #     client_max_body_size 6m;      # photo upload
  #   }
  location /api/ {
    default_type application/json;
    return 503 '{"code":"API_NOT_DEPLOYED","message":"report-service and api-gateway are not part of this repository"}';
  }

  # Single-page app: unknown paths serve index.html
  location / {
    try_files $uri /index.html;
  }
}
